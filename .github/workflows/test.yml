name: "units-test"
on:
  pull_request:
  push:
    branches:
      - v1

jobs:
  # unit tests
  units:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: oven-sh/setup-bun@v2
      with:
        version: 1.2.3

    - run: bun install --frozen-lockfile
    - run: bun test

  # test action works running from the graph
  test:
    strategy:
      fail-fast: false
      matrix:
        host:
          [
            ubuntu-latest,
            macos-latest,
            windows-latest,
          ]
    runs-on: ${{matrix.host}}
    steps:
    - uses: actions/checkout@v2
    - uses: ./
    - run: zigmod version
